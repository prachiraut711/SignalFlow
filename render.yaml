# Render Blueprint Specification for SignalFlow
# Free Tier Deployment: Frontend Static Site + Backend Web Service
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Backend Web Service (FastAPI + Embedded Redis Stream Worker)
  # ---------------------------------------------------------------------------
  - type: web
    name: signalflow-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ENVIRONMENT
        value: production
      - key: EMBED_WORKER
        value: "true"
      - key: DUCKDB_PATH
        value: /tmp/signalflow.duckdb
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend Static Site (React + Vite SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: signalflow-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
